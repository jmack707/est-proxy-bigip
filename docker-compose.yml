# For environments without an existing Vault/OpenBao instance (e.g. F5 UDF).
# Brings up dev-mode OpenBao + the shim together. NOT for production -- see
# bootstrap-openbao-dev.sh's header for why dev mode is a lab-only choice.
#
# Usage:
#   docker compose up -d openbao
#   ./bootstrap-openbao-dev.sh                      # prints AppRole creds
#   # paste those into est-shim.env, then:
#   docker compose up -d est-shim
services:
  openbao:
    image: ghcr.io/openbao/openbao:2.2.0
    command: server -dev
    environment:
      BAO_DEV_ROOT_TOKEN_ID: root
      BAO_DEV_LISTEN_ADDRESS: 0.0.0.0:8200
    ports:
      - "8200:8200"

  est-shim:
    build: .
    env_file: est-shim.env
    ports:
      - "8085:8085"
    depends_on:
      - openbao
