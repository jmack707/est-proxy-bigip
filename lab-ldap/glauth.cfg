# Lab directory fixture — NOT a production directory. See ADR-0007.
#
# Passwords are committed SHA-256 hashes of publicly documented values. That is
# deliberate and safe only because this fixture is lab-only, in the same spirit
# as dev-mode OpenBao's known root token (ADR-0004).
#
#   client1.example.com / estlab123
#   client2.example.com / estlab123
#
# Bind DNs produced by the baseDN + nameformat/groupformat below:
#   uid=client1.example.com,cn=users,cn=accounts,dc=example,dc=com
#
# which is FreeIPA's shape, so LDAP_BIND_DN_TEMPLATE is:
#   uid={username},cn=users,cn=accounts,dc=example,dc=com
#
# Change `dc=example,dc=com` here and in LDAP_BIND_DN_TEMPLATE together if your
# DOMAIN differs. Active Directory's UPN bind form is NOT reproduced by this
# fixture — see ADR-0007 for what that means for your testing.

debug = true

[ldap]
  enabled = true
  listen = "0.0.0.0:3893"

[ldaps]
  enabled = true
  listen = "0.0.0.0:3894"
  cert = "/app/config/ldap.crt"
  key = "/app/config/ldap.key"

[backend]
  datastore = "config"
  baseDN = "cn=accounts,dc=example,dc=com"
  nameformat = "uid"
  groupformat = "cn"

# sha256("estlab123")
[[users]]
  name = "client1.example.com"
  uidnumber = 5001
  primarygroup = 5501
  passsha256 = "1d83f7f91137f097cfc533bbae30982bed95c393237485733252e3f951ad3104"

[[users]]
  name = "client2.example.com"
  uidnumber = 5002
  primarygroup = 5501
  passsha256 = "1d83f7f91137f097cfc533bbae30982bed95c393237485733252e3f951ad3104"

[[groups]]
  name = "users"
  gidnumber = 5501
